name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the core repository (reference pages, CLI reference)
        uses: actions/checkout@v4
        with:
          repository: horae-dev/horae
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - uses: astral-sh/setup-uv@v6
      - name: Install MkDocs and the core package (at the versions of its uv.lock)
        run: |
          (cd core && uv export --frozen --no-dev --no-hashes --no-emit-project -o ../core-requirements.txt)
          pip install -r docs/requirements.txt -r core-requirements.txt
          pip install --no-deps ./core
      - name: Videos are narrated from their current scripts
        run: python3 tools/narrate.py --check docs/videos
      - name: Build (strict)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
